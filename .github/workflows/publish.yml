name: Daily Mini Rescue Hindi Automation

on:
  schedule:
    - cron: '30 3 * * *' # रोज सकाळी 3:30 UTC म्हणजेच 9:00 AM IST वाजता चालेल
  workflow_dispatch: 

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # येथे आपण groq ॲड केले आहे आणि जुनी अनावश्यक रिपीट ओळ काढली आहे
          pip install groq edge-tts moviepy google-api-python-client google-auth-oauthlib requests gtts

      - name: Run Automation Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python youtube_video_creation.py
